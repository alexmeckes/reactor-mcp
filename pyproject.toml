[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reactor-inference-mcp"
version = "0.4.0"
description = "Local MCP tools for Reactor Helios and FastH3-Omni inference sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "reactor-sdk==1.13.0", "httpx>=0.28,<1", "keyring>=25.7,<26; sys_platform == 'darwin'"]

[project.scripts]
reactor-mcp = "reactor_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/reactor_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills/reactor-workflow/SKILL.md" = "reactor_mcp/data/SKILL.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
